<!doctype html>
<html lang="en" data-page="login" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rased | Sign in</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/site.css">
<!-- Amplitude loads ONLY on the published host; anywhere else (localhost) the wrapper runs recorder-only.
     Analytics + Session Replay + Experiment (unified loader), then Guides & Surveys. -->
<script>if (location.hostname === 'khaledismail-sandbox.github.io') document.write(
  '<script src="https://cdn.amplitude.com/script/ad85aaa13604f0cb6816af5141d8b190.js"><\/script>' +
  '<script src="https://cdn.amplitude.com/script/ad85aaa13604f0cb6816af5141d8b190.engagement.js"><\/script>');</script>
<script src="../assets/js/analytics.js"></script>
<script src="../assets/js/app.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-top"><span class="lang-toggle">EN <i></i></span></div>
  <form class="login-card" id="login-form" novalidate>
    <div class="logo"><img src="../assets/img/logo.png" alt="Rased"></div>
    <div class="field"><label for="uid">User ID</label><input class="input" id="uid" autocomplete="off" spellcheck="false"></div>
    <p class="err" id="err" hidden>Unknown user</p>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <footer class="login-foot">
    <div>Provided by Elm · Rased Fleet Management</div>
    <div id="toggle-slot" style="display:flex;justify-content:center;margin-top:10px"></div>
  </footer>
</div>
<script>
(function () {
  var input = document.getElementById('uid');
  input.value = Rased.choice();
  var slot = document.getElementById('toggle-slot');
  slot.innerHTML = Rased.toggleHtml();
  Rased.bindToggle(slot);
  var err = document.getElementById('err'), busy = false;
  input.addEventListener('input', function () { err.hidden = true; });
  // Any user in seeded-users.json may sign in; anything else shows "Unknown user" and sends nothing.
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    busy = true;
    RasedAnalytics.signIn(input.value.trim(), '../platform/dashboard/').then(function (ok) {
      if (!ok) { err.hidden = false; busy = false; }
    }, function () { err.hidden = false; busy = false; });
  });
})();
</script>
</body>
</html>
